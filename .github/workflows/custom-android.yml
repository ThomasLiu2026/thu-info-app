name: Build Custom THUInfo Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn

      - name: Build clean release APK
        run: |
          cd apps/thu-info-app/android
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp apps/thu-info-app/android/app/build/outputs/apk/release/app-release.apk THUInfo_v3.16.4_custom_source.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THUInfo-v3.16.4-custom-source
          path: THUInfo_v3.16.4_custom_source.apk
          compression-level: 0
