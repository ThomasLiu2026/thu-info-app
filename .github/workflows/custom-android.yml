name: Build Custom THUInfo Android

on:
  push:
    branches:
      - master
      - "custom-*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      coexist_with_official:
        description: "Use independent package ID (com.unidy2002.thuinfo.custom) to coexist alongside official THU Info"
        required: false
        default: true
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: custom-android-node-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            custom-android-node-${{ runner.os }}-

      - name: Install dependencies
        run: yarn

      - name: Run app lint and unit tests
        run: |
          yarn workspace @thu-info/lib lint
          yarn workspace @thu-info/app lint
          yarn workspace @thu-info/app test

      - name: Prepare CI build copy
        shell: bash
        env:
          COEXIST_WITH_OFFICIAL: ${{ github.event.inputs.coexist_with_official != 'false' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          BUILD_GRADLE="apps/thu-info-app/android/app/build.gradle"
          MAIN_APP="apps/thu-info-app/android/app/src/main/java/com/unidy2002/thuinfo/MainApplication.kt"
          STRINGS_XML="apps/thu-info-app/android/app/src/main/res/values/strings.xml"
          DEBUG_KEYSTORE="apps/thu-info-app/android/app/debug.keystore"

          test -s "$DEBUG_KEYSTORE"

          # Sign release build with repository's debug.keystore in CI copy only
          sed -i 's/signingConfigs\.release/signingConfigs.debug/g' "$BUILD_GRADLE"
          grep -q 'signingConfig signingConfigs.debug' "$BUILD_GRADLE"
          if grep -q 'signingConfigs\.release' "$BUILD_GRADLE"; then
            echo "ERROR: signingConfigs.release is still referenced in $BUILD_GRADLE" >&2
            exit 1
          fi

          # Skip official signature check in CI build copy only
          sed -i '/verifySignature()/d' "$MAIN_APP"
          if grep -q 'verifySignature' "$MAIN_APP"; then
            echo "ERROR: verifySignature is still present in $MAIN_APP" >&2
            exit 1
          fi

          # Use distinct applicationId & launcher label by default so the APK installs
          # side-by-side without overwriting official THU Info user data
          if [ "${COEXIST_WITH_OFFICIAL}" = "true" ]; then
            sed -i 's/applicationId "com.unidy2002.thuinfo"/applicationId "com.unidy2002.thuinfo.custom"/' "$BUILD_GRADLE"
            sed -i 's/<string name="app_name">THU Info<\/string>/<string name="app_name">THU Info Custom<\/string>/' "$STRINGS_XML"
            grep -q 'applicationId "com.unidy2002.thuinfo.custom"' "$BUILD_GRADLE"
            grep -q 'THU Info Custom' "$STRINGS_XML"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: custom-android-gradle-${{ runner.os }}-${{ hashFiles('apps/thu-info-app/android/**/*.gradle*', 'apps/thu-info-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            custom-android-gradle-${{ runner.os }}-

      - name: Generate crisp legacy launcher icons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          RES='apps/thu-info-app/android/app/src/main/res'
          SEAL_WHITE='/tmp/tsinghua-logo-white.png'

          if curl -L --fail --retry 3 \
            -A 'THUInfoCustomBuild/1.0 (https://github.com/ThomasLiu2026/thu-info-app)' \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Tsinghua_University_Logo.svg/960px-Tsinghua_University_Logo.svg.png' \
            -o /tmp/tsinghua-logo.png; then
            # Keep the source alpha channel, recolor the seal itself to white.
            convert /tmp/tsinghua-logo.png \
              -channel RGB -fill white -colorize 100 +channel \
              "$SEAL_WHITE"
          else
            cp "$RES/drawable-xxxhdpi/tsinghua_seal_foreground_raster.png" "$SEAL_WHITE"
          fi

          # Force Android to use the density-specific pre-rendered PNGs below.
          # This avoids the traced adaptive-vector path that looked soft on-device.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
                "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            emblem=$(( size * 66 / 100 ))
            dir="$RES/mipmap-$density"
            mkdir -p "$dir"

            convert -size "${size}x${size}" xc:'#660974' \
              \( "$SEAL_WHITE" -filter Lanczos -resize "${emblem}x${emblem}" -unsharp 0x0.65+0.65+0.008 \) \
              -gravity center -composite \
              "$dir/ic_launcher.png"

            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build clean release APK
        working-directory: apps/thu-info-app/android
        env:
          SIGNATURE_DIGEST: ""
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="apps/thu-info-app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          fi

      - name: Rename APK
        run: cp apps/thu-info-app/android/app/build/outputs/apk/release/app-release.apk THUInfo_v3.16.4_custom_source.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THUInfo-v3.16.4-custom-source
          path: THUInfo_v3.16.4_custom_source.apk
          compression-level: 0
